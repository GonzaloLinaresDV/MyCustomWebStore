<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Archivo CSS personalizado -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVEGACIÓN -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Logo y Nombre (Configurable desde script.js) -->
            <a href="#" id="brand-container" class="flex items-center gap-3 group">
                <img id="brand-logo" src="" alt="Logo" class="w-12 h-12 object-cover rounded-xl shadow-md group-hover:scale-105 transition">
                <span id="brand-name" class="text-2xl font-extrabold tracking-tight text-slate-900"></span>
            </a>

            <!-- Navegación y Acciones -->
            <div class="flex items-center gap-4">
                <!-- Botón de Administrador -->
                <button id="admin-nav-btn" onclick="openAdminModal()" class="flex items-center gap-2 text-sm font-medium text-slate-600 hover:text-indigo-600 bg-slate-100 hover:bg-indigo-50 px-4 py-2.5 rounded-xl transition">
                    <i class="fa-solid fa-lock text-slate-500"></i>
                    <span>Administración</span>
                </button>

                <!-- Botón de Carrito -->
                <button onclick="toggleCart()" class="relative bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl shadow-md hover:shadow-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow-sm">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- BARRA DE BÚSQUEDA Y FILTROS -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <!-- Buscador -->
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar productos..." class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm">
            </div>

            <!-- Filtros por Categoría -->
            <div id="category-filters" class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="filterCategory('todos')" class="cat-btn px-4 py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-sm transition">Todos</button>
            </div>
        </div>

        <!-- GRILLA DE PRODUCTOS -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Los productos se inyectan dinámicamente desde JavaScript -->
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 mt-16 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500">
            <p id="footer-brand-name"></p>
            <p class="mt-1">Todos los derechos reservados &copy; 2026</p>
        </div>
    </footer>

    <!-- CARRITO DE COMPRAS (SIDEBAR) -->
    <div id="cart-sidebar" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <!-- Cabecera Carrito -->
                <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-bag-shopping text-indigo-600"></i> Tu Carrito
                    </h2>
                    <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-200 transition">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <!-- Lista de Items -->
                <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
                    <!-- Items dinámicos -->
                </div>
                <!-- Resumen y Checkout -->
                <div class="p-6 border-t border-slate-100 bg-slate-50 space-y-4">
                    <div class="flex justify-between text-base font-semibold text-slate-900">
                        <span>Subtotal:</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-credit-card"></i> Finalizar Compra
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE LOGIN ADMIN -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="closeLoginModal()"></div>
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 relative z-10 mx-4 border border-slate-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-900">Acceso de Dueño</h3>
                <p class="text-sm text-slate-500 mt-1">Ingresa tus credenciales para administrar la tienda</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Usuario</label>
                    <input type="text" id="admin-user" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Contraseña</label>
                    <input type="password" id="admin-pass" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">Ingresar al Panel</button>
            </form>
        </div>
    </div>

    <!-- MODAL PANEL DE ADMINISTRACIÓN -->
    <div id="admin-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="closeAdminModal()"></div>
        <div class="bg-white rounded-3xl shadow-2xl max-w-5xl w-full max-h-[90vh] flex flex-col relative z-10 mx-4 border border-slate-100 overflow-hidden">
            <!-- Header Admin -->
            <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-screwdriver-wrench text-indigo-600"></i> Panel de Control de Inventario
                </h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-200 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <!-- Cuerpo Admin -->
            <div class="flex-1 overflow-y-auto p-6 space-y-8">
                <!-- Formulario Nuevo Producto -->
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    <h4 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-indigo-600"></i> Agregar Nuevo Producto
                    </h4>
                    <form onsubmit="addProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <input type="text" id="new-name" placeholder="Nombre del producto" required class="px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                        <input type="text" id="new-category" placeholder="Categoría" required class="px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                        <input type="number" id="new-price" placeholder="Precio ($)" step="0.01" required class="px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                        <input type="number" id="new-stock" placeholder="Stock inicial" required class="px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                        <input type="url" id="new-image" placeholder="URL de la imagen" required class="px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Guardar Producto
                        </button>
                    </form>
                </div>

                <!-- Tabla de Gestión de Productos -->
                <div>
                    <h4 class="text-lg font-bold text-slate-900 mb-4">Inventario Actual</h4>
                    <div class="overflow-x-auto border border-slate-200 rounded-2xl">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 text-xs uppercase tracking-wider font-bold border-b border-slate-200">
                                    <th class="p-4">Producto</th>
                                    <th class="p-4">Categoría</th>
                                    <th class="p-4">Precio</th>
                                    <th class="p-4">Stock</th>
                                    <th class="p-4 text-center">Acciones de Precio / Stock</th>
                                    <th class="p-4 text-center">Eliminar</th>
                                </tr>
                            </thead>
                            <tbody id="admin-products-table" class="divide-y divide-slate-100 text-sm">
                                <!-- Filas dinámicas -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script src="script.js"></script>
</body>
</html>
